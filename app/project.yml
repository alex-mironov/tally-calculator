# project.yml — the Xcode project, generated by XcodeGen.
#
#   brew install xcodegen && cd app && xcodegen
#
# Generated rather than committed because a .pbxproj is not reviewable and every
# change to it is a merge conflict waiting to happen. This file is the source of
# truth; Tally.xcodeproj is a build product and is gitignored.
#
# Note what this replaces: mobile/ios was regenerated by `expo prebuild` on every
# release and was never committed at all, so the native project has not been
# under review until now.
name: Tally

options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  TallyKit:
    path: TallyKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 2AMB7W8PVR
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The design is authored light-first and the app picks its own palette
    # rather than following the system, so there is nothing for the system
    # appearance to drive. See Theme.swift.
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Tally:
    type: application
    platform: iOS
    sources:
      - path: Tally
    dependencies:
      - package: TallyKit
    settings:
      base:
        PRODUCT_NAME: Tally
        PRODUCT_BUNDLE_IDENTIFIER: app.tally-calculator
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        INFOPLIST_FILE: Tally/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tally/Tally.entitlements
        # 1,2 — iPhone and iPad. The React Native app was iPhone-portrait only;
        # this is a universal app, so every layout has to answer for a regular
        # width class as well as a compact one.
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # The icon is an Icon Composer file (Resources/AppIcon.icon) — the
        # layered format iOS 26 renders in its light, dark, tinted and clear
        # appearances. actool compiles it like an asset catalog; this names it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # A separate bundle id for development, which buys two things:
        #
        #  · the debug build sits on the simulator *beside* the React Native
        #    app instead of replacing it, which is what Phase 3's parity work
        #    needs;
        #  · the iCloud entitlement is `$(TeamIdentifierPrefix)$(CFBundleIdentifier)`,
        #    so a different bundle id automatically means a different key-value
        #    container — a debug build cannot scribble on the real tabs and
        #    preferences synced to a real device.
        #
        # Release keeps the shipping identifier, so the App Store lineage, the
        # match profile and the user's existing iCloud data are all unchanged.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.tally-calculator.dev
          PRODUCT_NAME: Tally Dev

schemes:
  Tally:
    build:
      targets:
        Tally: all
    run:
      config: Debug
    archive:
      config: Release
