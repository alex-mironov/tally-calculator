name: iOS TestFlight

# Every push to main that touches app/** builds and uploads to TestFlight.
#
# Armed on 21 Sep 2026, after the lane's first green run (build 56, uploaded
# from a local machine). The CI path itself — the secrets, the macos-15 runner,
# Homebrew XcodeGen — has not run yet; the first ordinary commit to app/** is
# its first test, so watch that run. workflow_dispatch stays for manual builds.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/distribute-ios-app.yml"

# One TestFlight upload at a time — build numbers come from latest_testflight_build_number.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      # No Node, and no `npm ci`. The app has no JavaScript in it.

      - name: Set up Ruby + bundler (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app

      - name: Install XcodeGen
        # Tally.xcodeproj is generated from project.yml rather than committed —
        # see app/README.md. This replaces the `expo prebuild` step.
        run: brew install xcodegen

      - name: Configure SSH for fastlane match
        # Read-only deploy key for the private certs repo (MATCH_GIT_URL is an SSH URL).
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_DEPLOY_KEY" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          cat >> ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/match_key
            StrictHostKeyChecking no
          EOF

      - name: Write App Store Connect API key
        # Secret holds the .p8 base64-encoded; decode it to a file fastlane can read.
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: echo "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_OPT_OUT_USAGE: "YES"
          FASTLANE_SKIP_UPDATE_CHECK: "YES"
          FASTLANE_HIDE_TIMESTAMP: "YES"
          FASTLANE_DISABLE_COLORS: "1"
          # fastlane warns loudly without a UTF-8 locale, and some of its file
          # handling genuinely misbehaves under the runner's default C locale.
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          CI: "true"
        run: bundle exec fastlane ios beta
