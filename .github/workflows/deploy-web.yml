name: Web

# CI/CD for the web half (web/ — the TanStack Start app that serves the
# marketing site, the /s/:id share pages and the share API): typecheck on
# every change, deploy to Cloudflare Workers when main moves.
#
# One secret required: CLOUDFLARE_API_TOKEN — create it at
# https://dash.cloudflare.com/profile/api-tokens with the
# "Edit Cloudflare Workers" template (the account id is pinned in
# web/wrangler.jsonc), then:
#   gh secret set CLOUDFLARE_API_TOKEN --repo alex-mironov/tally-calculator

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# Deploys land in push order — never let an older commit's deploy finish last.
concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Vite 8 needs Node 20.19+ — 22 keeps us clear of the floor
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # Both generated files this depends on — routeTree.gen.ts and
        # worker-configuration.d.ts — are committed, so this runs before any
        # build and needs no Cloudflare auth.
        run: npm run check

      - name: Deploy to Cloudflare
        # `npm run deploy` = vite build && wrangler deploy. The build also
        # prerenders `/` to static HTML; the Cloudflare Vite plugin writes a
        # redirect under .wrangler/deploy/ pointing wrangler at dist/.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
